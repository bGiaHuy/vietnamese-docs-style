name: Build and Publish Skill Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-liberation
      - run: python -m pytest -q
      - run: python scripts/package_skill.py --output dist/vietnamese-docx.zip
      - run: sha256sum dist/vietnamese-docx.zip > dist/vietnamese-docx.zip.sha256
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/vietnamese-docx.zip dist/vietnamese-docx.zip.sha256 --clobber
          else
            gh release create "${TAG}" dist/vietnamese-docx.zip dist/vietnamese-docx.zip.sha256 \
              --title "vietnamese-docs-style ${TAG}" \
              --generate-notes
          fi
